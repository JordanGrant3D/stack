name: stack-sys-monitor
base: core24
version: '1.0.5'
summary: C++20 TUI system monitor
description: |
  A terminal-based system monitoring tool built with FTXUI and C++20.
grade: stable # Use 'stable' when you are ready to publish
confinement: strict # Gives full host system and /proc access

parts:
  stack:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
    build-attributes:
      - enable-patchelf

apps:
  stack:
    command: usr/local/bin/stack
    common-id: io.github.JordanGrant3D.sta
    plugs:
      - system-observe
