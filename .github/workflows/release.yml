name: Build and Publish Snap

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.4, v1.0.5, etc.

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Version from Tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Update version in snapcraft.yaml
        run: |
          sed -i "s/^version: .*/version: '${{ env.VERSION }}'/" snap/snapcraft.yaml

      - name: Build and Publish Snap
        uses: canonical/snapcraft-action@v2
        with:
          snapcraft-token: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          release: stable
