name: Build and Publish Snap

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract Version from Tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Update version in snapcraft.yaml
        run: |
          sed -i "s/^version: .*/version: '${{ env.VERSION }}'/" snap/snapcraft.yaml

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ make

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v3

      - name: Build Snap
        run: |
          snapcraft pack --destructive-mode

      - name: Publish Snap to Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          snapcraft upload --release=stable stack-sys-monitor_${{ env.VERSION }}_amd64.snap
